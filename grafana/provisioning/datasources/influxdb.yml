apiVersion: 1

datasources:
  - name: InfluxDB_Flux
    type: influxdb
    uid: nexus_influxdb_flux
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: nexus
      defaultBucket: nexus_telemetry
      tlsSkipVerify: true
    secureJsonData:
      token: $__env{INFLUXDB_TOKEN}
    editable: false
    prune: true
